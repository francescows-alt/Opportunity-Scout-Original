{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Opportunity Scout{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tracker/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'campaign-list' %}">
            <span class="brand-mark">OS</span>
            <span>Opportunity Scout</span>
        </a>
        <span class="local-badge">Private · running locally</span>
    </header>
    <main class="page-shell">
        {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
