{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Opportunity Scout{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tracker/styles.css' %}">
</head>
<body>
    <div class="app-frame">
        <header class="site-header">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark">◇</span>
                <span>Internship OS</span>
            </a>
            <span class="local-badge">Private · local</span>
        </header>
        <nav class="main-nav" aria-label="Main navigation">
            <a class="{% if request.resolver_match.url_name == 'profile' %}current{% endif %}" href="{% url 'profile' %}">♙ <span>My profile</span></a>
            <a class="{% if request.resolver_match.url_name == 'inbox' %}current{% endif %}" href="{% url 'inbox' %}">▣ <span>Job inbox</span></a>
            <a class="{% if request.resolver_match.url_name == 'dashboard' or 'opportunity' in request.resolver_match.url_name %}current{% endif %}" href="{% url 'dashboard' %}">▦ <span>Applications</span></a>
            <a class="{% if 'campaign' in request.resolver_match.url_name %}current{% endif %}" href="{% url 'campaign-list' %}">☷ <span>Search rules</span></a>
        </nav>
        <main class="page-shell">
            {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{% static 'tracker/dictation.js' %}" defer></script>
</body>
</html>
